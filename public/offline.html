<!doctype html>
<html lang="en">
<head>

  <title>You are offline | D8-LPA</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 20px; line-height: 1.5;
      background: #fdfbfc; color: #2a1c22; padding: 24px; box-sizing: border-box; }
